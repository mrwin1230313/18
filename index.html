<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>18岁验证</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border-radius: 1.75rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }
    .title {
      font-size: 2rem;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }
    .question {
      color: #94a3b8;
      font-size: 1.15rem;
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      gap: 0.75rem;
    }
    button {
      flex: 1;
      border: none;
      border-radius: 1rem;
      padding: 1rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s ease;
      font-family: inherit;
    }
    .yes {
      background: #3b82f6;
      color: white;
    }
    .yes:hover {
      background: #2563eb;
    }
    .no {
      background: #334155;
      color: #e2e8f0;
    }
    .no:hover {
      background: #475569;
    }
    button:active {
      transform: scale(0.97);
    }
    .result {
      margin-top: 1.75rem;
      padding: 1rem;
      border-radius: 1rem;
      font-size: 1.05rem;
      font-weight: 500;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #64748b;
      transition: 0.2s ease;
    }
    .result.success {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
    }
    .result.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">🔞</h1>
    <p class="question">您是否已年满18岁？</p>
    <div class="buttons">
      <button class="yes" id="yesBtn">是</button>
      <button class="no" id="noBtn">否</button>
    </div>
    <div class="result" id="result">请选择</div>
  </div>

  <script>
    // ===== 配置跳转地址 =====
    const YES_URL = 'https://www.bilibili.com/video/BV1ZV411t7J3/?spm_id_from=333.337.search-card.all.click';
    const NO_URL  = 'https://mrwin1230313.github.io/';

    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const result = document.getElementById('result');

    yesBtn.addEventListener('click', () => {
      result.textContent = '✅ 验证通过，正在跳转…';
      result.className = 'result success';
      setTimeout(() => {
        window.location.href = YES_URL;
      }, 400);
    });

    noBtn.addEventListener('click', () => {
      result.textContent = '🚫 未满18岁，即将离开…';
      result.className = 'result error';
      setTimeout(() => {
        window.location.href = NO_URL;
      }, 400);
    });
  </script>
</body>
</html>
