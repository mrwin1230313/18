
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年龄验证 · 18岁</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 1.5rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2.8rem 2.2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(148, 163, 184, 0.15);
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      line-height: 1.2;
    }

    h1 span {
      background: #3b82f6;
      font-size: 1.8rem;
      width: 3.2rem;
      height: 3.2rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 1.4rem;
      box-shadow: 0 8px 18px -4px rgba(59, 130, 246, 0.4);
    }

    .subhead {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 2.2rem;
      padding-left: 0.2rem;
      border-left: 4px solid #3b82f6;
      padding-left: 1.2rem;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.6rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0.85;
    }

    .date-wrapper {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .date-wrapper input {
      background: #0b1220;
      border: 1.5px solid #334155;
      border-radius: 1.2rem;
      padding: 0.9rem 1.2rem;
      font-size: 1.1rem;
      color: #f1f5f9;
      font-weight: 500;
      flex: 1;
      min-width: 0;
      outline: none;
      transition: border 0.15s ease, box-shadow 0.15s ease;
      font-family: 'Inter', system-ui, sans-serif;
      appearance: none;
    }

    .date-wrapper input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
    }

    .date-wrapper input[type="number"]::-webkit-outer-spin-button,
    .date-wrapper input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .date-wrapper input[type="number"] {
      -moz-appearance: textfield;
    }

    .date-wrapper input::placeholder {
      color: #4b5a6e;
      font-weight: 400;
      font-size: 1rem;
    }

    /* 禁止选中数字的上下箭头干扰视觉，保留可访问性 */
    .date-wrapper input {
      text-align: center;
    }

    .hint {
      display: flex;
      justify-content: space-between;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: #64748b;
      padding: 0 0.5rem;
    }

    .hint span {
      opacity: 0.7;
      letter-spacing: 0.3px;
    }

    .btn {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 1.4rem;
      padding: 1.1rem 1.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
      box-shadow: 0 12px 24px -8px rgba(59, 130, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 18px 28px -8px rgba(59, 130, 246, 0.5);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 8px 16px -6px rgba(59, 130, 246, 0.5);
    }

    .message {
      margin-top: 1.6rem;
      padding: 1rem 1.2rem;
      border-radius: 1.2rem;
      font-weight: 500;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #1e293b;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .message.success {
      background: rgba(22, 101, 52, 0.25);
      border-color: #22c55e;
      color: #bbf7d0;
    }

    .message.error {
      background: rgba(185, 28, 28, 0.2);
      border-color: #ef4444;
      color: #fecaca;
    }

    .message.neutral {
      color: #cbd5e1;
    }

    .message-icon {
      font-size: 1.5rem;
      line-height: 1;
    }

    .message-text {
      flex: 1;
    }

    .footer-note {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.75rem;
      color: #475569;
      letter-spacing: 0.4px;
      border-top: 1px solid #1e293b;
      padding-top: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .footer-note svg {
      opacity: 0.6;
    }

    /* 内联装饰圆点 */
    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #3b82f6;
      border-radius: 50%;
      margin: 0 4px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <h1>
      <span>🔞</span> 18+
    </h1>
    <div class="subhead">年龄验证 · 仅限成年人</div>

    <!-- 生日输入区 -->
    <div class="input-group">
      <label for="day">出生日期</label>
      <div class="date-wrapper">
        <input type="number" id="day" placeholder="DD" min="1" max="31" inputmode="numeric" aria-label="出生日" value="">
        <input type="number" id="month" placeholder="MM" min="1" max="12" inputmode="numeric" aria-label="出生月" value="">
        <input type="number" id="year" placeholder="YYYY" min="1900" max="2025" inputmode="numeric" aria-label="出生年" value="">
      </div>
      <div class="hint">
        <span>日</span>
        <span>月</span>
        <span>年</span>
      </div>
    </div>

    <button class="btn" id="verifyBtn">
      <span>✓</span> 验证年龄
    </button>

    <!-- 消息区域 -->
    <div class="message neutral" id="messageBox">
      <span class="message-icon">📅</span>
      <span class="message-text" id="messageText">请填写您的出生日期</span>
    </div>

    <div class="footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      必须年满18周岁
      <span class="dot"></span>
      信息不会存储
    </div>
  </div>

  <script>
    (function() {
      // DOM 元素
      const dayInput = document.getElementById('day');
      const monthInput = document.getElementById('month');
      const yearInput = document.getElementById('year');
      const verifyBtn = document.getElementById('verifyBtn');
      const messageBox = document.getElementById('messageBox');
      const messageText = document.getElementById('messageText');

      // 辅助: 切换消息状态
      function setMessage(type, icon, text) {
        messageBox.classList.remove('neutral', 'success', 'error');
        messageBox.classList.add(type);
        // 更新图标
        const iconSpan = messageBox.querySelector('.message-icon');
        if (iconSpan) iconSpan.textContent = icon;

        messageText.textContent = text;
      }

      // 重置消息到中性状态
      function resetMessage() {
        setMessage('neutral', '📅', '请填写您的出生日期');
      }

      // 检查输入是否为空 (三个都为空则视为空)
      function isAllEmpty() {
        return dayInput.value.trim() === '' && monthInput.value.trim() === '' && yearInput.value.trim() === '';
      }

      // 纯数字校验并返回整数值，无效返回 NaN
      function parseInputNumber(inputEl, min, max) {
        const raw = inputEl.value.trim();
        if (raw === '') return NaN;
        const num = Number(raw);
        // 检查是否为整数，非数字、NaN、超出范围都返回 NaN
        if (!Number.isInteger(num) || isNaN(num) || num < min || num > max) return NaN;
        return num;
      }

      // 获取生日对象 (若无效返回 null)
      function getBirthDate() {
        const day = parseInputNumber(dayInput, 1, 31);
        const month = parseInputNumber(monthInput, 1, 12);
        const year = parseInputNumber(yearInput, 1900, new Date().getFullYear());

        if (isNaN(day) || isNaN(month) || isNaN(year)) {
          return { valid: false, reason: 'empty_or_invalid' };
        }

        // 构造日期对象 (注意月份从0开始，但Date会自动进位，但我们先构造然后用比较验证)
        // 但Date构造函数中 monthIndex 从0开始，所以我们传 month-1
        const date = new Date(year, month - 1, day);

        // 检查日期是否有效且与输入一致 (防止 2月30日这种自动进位)
        if (date.getFullYear() !== year ||
            date.getMonth() !== month - 1 ||
            date.getDate() !== day) {
          return { valid: false, reason: 'invalid_date' };
        }

        // 同时检查日期是否在将来
        const today = new Date();
        today.setHours(0, 0, 0, 0); // 只比较日期部分
        const inputDate = new Date(year, month - 1, day);
        inputDate.setHours(0, 0, 0, 0);
        if (inputDate > today) {
          return { valid: false, reason: 'future_date' };
        }

        return { valid: true, date: inputDate, year, month, day };
      }

      // 计算年龄 (精确到日)
      function calculateAge(birthDate) {
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        // 如果当前月份小于生日月份，或者月份相同但当天小于生日日期，则年龄减1
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
          age--;
        }
        return age;
      }

      // 核心验证逻辑
      function verifyAge() {
        // 1. 检查是否所有字段都为空
        if (isAllEmpty()) {
          setMessage('neutral', '📅', '请填写完整的出生日期');
          return;
        }

        // 2. 检查是否有任何字段为空 (部分填写)
        const dayRaw = dayInput.value.trim();
        const monthRaw = monthInput.value.trim();
        const yearRaw = yearInput.value.trim();
        if (dayRaw === '' || monthRaw === '' || yearRaw === '') {
          setMessage('error', '⚠️', '请完整填写日、月、年');
          return;
        }

        // 3. 尝试解析生日
        const birthInfo = getBirthDate();
        if (!birthInfo.valid) {
          if (birthInfo.reason === 'invalid_date') {
            setMessage('error', '❌', '无效日期，请检查日/月/年是否正确');
          } else if (birthInfo.reason === 'future_date') {
            setMessage('error', '🚫', '出生日期不能在未来');
          } else {
            setMessage('error', '⚠️', '请输入有效的数字（日1-31，月1-12，年1900-2025）');
          }
          return;
        }

        // 4. 计算年龄并验证
        const age = calculateAge(birthInfo.date);

        if (age >= 18) {
          // 成功: 年满18
          setMessage('success', '🎉', `验证通过：您已年满 ${age} 周岁，欢迎进入！`);
        } else {
          // 年龄不足
          setMessage('error', '🔞', `抱歉，您只有 ${age} 岁，未满18周岁，禁止访问。`);
        }
      }

      // 输入时重置消息 (避免旧消息干扰)
      function resetOnInput() {
        // 如果当前消息不是中性，则重置为中性
        if (!messageBox.classList.contains('neutral')) {
          resetMessage();
        } else {
          // 如果已经是中性，但文本不是标准提示，也重置 (比如之前显示"请填写...")
          if (messageText.textContent !== '请填写您的出生日期' && 
              messageText.textContent !== '请填写完整的出生日期' &&
              messageBox.classList.contains('neutral')) {
            // 但注意，如果用户开始输入我们希望显示默认提示
            // 这里可以优化：如果正在输入，可以显示一个更友好的提示
            // 但为了简洁，当用户输入时如果消息是特定样式，重置成中性
            if (!(messageText.textContent === '请填写您的出生日期' || 
                  messageText.textContent === '请填写完整的出生日期')) {
              resetMessage();
            }
          }
        }

        // 个别情况：如果三个都空，显示“请填写您的出生日期”；否则可以显示“输入完成请点击验证”
        if (isAllEmpty()) {
          setMessage('neutral', '📅', '请填写您的出生日期');
        } else {
          // 如果部分填写或全部填写，但还没有验证，可以给出中性提示
          // 检查是否所有字段都有值
          const allFilled = dayInput.value.trim() !== '' && monthInput.value.trim() !== '' && yearInput.value.trim() !== '';
          if (allFilled) {
            setMessage('neutral', '🔍', '点击“验证年龄”按钮');
          } else {
            setMessage('neutral', '✏️', '请完整填写日、月、年');
          }
        }
      }

      // 绑定事件监听
      verifyBtn.addEventListener('click', verifyAge);

      // 输入框事件: 输入时重置消息状态 (使用防抖更优雅，但这里简单处理)
      // 同时限制输入字符 (只允许数字，且自动纠正非数字)
      function sanitizeInput(e) {
        const input = e.target;
        // 移除非数字字符 (但允许空字符串)
        let val = input.value.replace(/[^0-9]/g, '');
        // 限制最大长度
        if (input.id === 'year') {
          if (val.length > 4) val = val.slice(0, 4);
        } else {
          if (val.length > 2) val = val.slice(0, 2);
        }
        input.value = val;

        // 额外处理: 如果输入的值超过范围，可以保留但验证时会提示，不用强行纠正
        // 自动处理月份/日期补零? 不需要，验证时候用数字比较

        // 重置消息
        resetOnInput();
      }

      // 对三个输入框应用输入处理
      [dayInput, monthInput, yearInput].forEach(input => {
        input.addEventListener('input', sanitizeInput);
        // 防止粘贴非数字内容 (oninput已经处理)
        // 添加键盘上下箭头、e等屏蔽? 其实number类型会处理部分，但浏览器不一致，用input事件保险
        input.addEventListener('keydown', (e) => {
          // 允许控制键 (退格、删除、Tab、箭头等)
          const controlKeys = ['Backspace', 'Delete', 'Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'];
          if (controlKeys.includes(e.key)) return;
          // 允许数字键
          if (/^[0-9]$/.test(e.key)) return;
          // 否则阻止
          e.preventDefault();
        });
      });

      // 额外: 当input失去焦点时，如果值有效但格式不规范(比如月份1写成01)，不做处理，方便输入
      // 处理空状态初始化
      resetMessage();

      // 也可以用回车键触发验证
      document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            verifyAge();
          }
        });
      });

      // 附加焦点优化: 输入长度达到2位时自动跳到下一个字段(用户体验)
      dayInput.addEventListener('input', function() {
        if (this.value.length === 2) monthInput.focus();
      });
      monthInput.addEventListener('input', function() {
        if (this.value.length === 2) yearInput.focus();
      });
      // 年份不自动跳转，但可以当4位时停止
    })();
  </script>
</body>
</html>
